name: Build Windows Daemon

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Upload daemon executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: mentions-daemon-windows-x64
          path: target/release/mentions-daemon.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: Mentions Windows Daemon (Latest)
          prerelease: false
          files: target/release/mentions-daemon.exe