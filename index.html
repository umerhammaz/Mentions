<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mentions</title>
<meta name="description" content="Local controller for the Mentions daemon.">
<link rel="icon" type="image/png" href="/assets/mentions_icon.png">
<link rel="apple-touch-icon" href="/assets/mentions_icon.png">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/reset.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/layout.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/screens.css">
</head>
<body class="is-locked">
<a class="skip" href="#main">Skip to content</a>

<nav class="rail" aria-label="Primary">
  <div class="rail__top">
    <div class="rail__brand">
      <a href="/" class="rail__brand-link">
        <img class="rail__logo" src="/assets/mentions_logo.png" alt="Mentions" width="300" height="60">
      </a>
    </div>
    <div class="rail__nav">
      <a class="rail__link" href="/" data-nav="commands">
        <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#list"/></svg>
        <span>Commands</span>
      </a>
      <a class="rail__link" href="/settings" data-nav="settings">
        <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#sliders"/></svg>
        <span>Settings</span>
      </a>
    </div>
  </div>
  <div class="rail__footer">
    <div class="rail__status-row">
      <div id="status" class="appbar__status" aria-live="polite"></div>
      <button id="hook-toggle" class="btn btn--sm rail__pause-btn" hidden aria-pressed="false">Pause</button>
    </div>
    <div id="rail-version" class="rail__version t-caption"></div>
  </div>
</nav>

<div class="workspace">
  <div id="banners" class="banners"></div>
  <main id="main" tabindex="-1"></main>
</div>

<div id="live" class="sr-only" aria-live="polite"></div>
<div id="alert" class="sr-only" aria-live="assertive"></div>

<dialog id="confirm" class="dialog"></dialog>

<div id="toast-host" class="toast-host" aria-live="polite"></div>

<noscript><p class="noscript">Mentions' controller needs JavaScript. The daemon keeps working without it.</p></noscript>

<script type="module" src="/assets/js/main.js"></script>
</body>
</html>
